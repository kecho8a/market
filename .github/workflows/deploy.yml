          VITE_SUPABASE_URL: https://gqhanfjhqfeqsgpscmet.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxaGFuZmpocWZlcXNncHNjbWV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMzMxMjksImV4cCI6MjA5NDgwOTEyOX0.WkO1pwDH8uTV--wmOcDL-Bz73ZOZT50dyc2-cAN6Cew
          VITE_VAPID_PUBLIC_KEY: BK1GCkznJWRWgopv6XmBLDZUt6t-v9zdC9zuaUo0EfmyLA5ejib-0srDHJBvnsClQKGKyyfv6-jQ_W_FS6W6MFQ
          VITE_PUSH_WEBHOOK_URL: https://market-cbh.pages.dev/api/push-notify
          VITE_WEBHOOK_SECRET: 5fca5a4d8825d4de66811590f47af870b01d45e80f391920f4ea76a59ae3c8bf
          VITE_ADMIN_USER: kecho8a@gmail.com
