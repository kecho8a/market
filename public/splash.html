<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f5d34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Marketo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f5d34;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Clean solid background - no gradients/grids */

    .splash-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      width: 100%;
      max-width: 400px;
    }

    /* Logo wrapper - clean, transparent */
    .logo-wrapper {
      position: relative;
      margin-bottom: 28px;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      animation: logo-zoom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform: scale(0.3);
    }
    .logo-fallback {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      position: relative;
      z-index: 1;
      animation: logo-zoom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform: scale(0.3);
    }

    /* Store name */
    .store-name {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      animation: fade-up 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Subtitle */
    .store-tagline {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 40px;
      animation: fade-up 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    /* Loading section */
    .loading-section {
      animation: fade-up 0.8s 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(10px);
    }
    .loading-text {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .loading-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(1) { animation-delay: 0s; }
    .loading-dots span:nth-child(2) { animation-delay: 0.16s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.32s; }

    /* Progress bar */
    .progress-track {
      width: 140px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
      margin-top: 20px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255,255,255,0.6), rgba(255,255,255,0.2));
      background-size: 200% 100%;
      animation: progress-slide 1.8s ease-in-out infinite, progress-grow 2s 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      width: 0%;
    }

    /* Animations */
    @keyframes logo-zoom {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
    @keyframes progress-slide {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes progress-grow {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* Safe area for notched phones */
    @supports (padding-top: env(safe-area-inset-top)) {
      .splash-container {
        padding-top: calc(40px + env(safe-area-inset-top));
        padding-bottom: calc(40px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="logo-fallback" id="logo">🛒</div>
    </div>

    <div class="store-name" id="storeName">Marketo</div>
    <div class="store-tagline">Supermercado Premium</div>

    <div class="loading-section">
      <div class="loading-text">Cargando pasillos...</div>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var themeColor = '#0f5d34';
      var siteName = 'Marketo';
      var logoUrl = '';

      try {
        var saved = localStorage.getItem('trv_config');
        if (saved) {
          var cfg = JSON.parse(saved);
          if (cfg.theme_color) themeColor = cfg.theme_color;
          if (cfg.site_nombre) siteName = cfg.site_nombre;
          if (cfg.logo_url) logoUrl = cfg.logo_url;
        }
      } catch(e) {}

      // Apply theme color
      document.body.style.backgroundColor = themeColor;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor);

      // Apply store name
      document.getElementById('storeName').textContent = siteName;
      document.title = siteName;

      // Apply logo
      if (logoUrl) {
        var img = document.createElement('img');
        img.src = logoUrl;
        img.alt = siteName;
        img.className = 'logo-img';
        img.onerror = function() { this.style.display = 'none'; };
        var fallback = document.getElementById('logo');
        fallback.parentNode.replaceChild(img, fallback);
      }

      // Redirect to app after splash
      setTimeout(function() {
        window.location.replace('/');
      }, 2200);
    })();
  </script>
</body>
</html>
